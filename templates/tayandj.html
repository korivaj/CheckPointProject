{% extends "base.html" %}

{%block content%}

<h2>Rate these Resident Evil characters!</h2>

<form method="post">
<div>
    <img src="{{url_for('static', filename='images/ResidentEvil/Chris.jpg')}}", class="re_image">
    <div class="star-rating">
      {% for i in range(1, 6) %}
        <input type="radio" id="Chris-star{{ i }}" name="Chris" value="{{ i }}" />
        <label for="Chris-star{{ i }}" title="{{ i }} star{% if i > 1 %}s{% endif %}">★</label>
      {% endfor %}
    </div>
<br>
</div>
<div>
    <img src="{{url_for('static', filename='images/ResidentEvil/Claire.jpg')}}", class="re_image">

      {% endfor %}
    </div>
<br>
</div>

<br>

<div class="star-rating">

    </div>
<br>
</div>
<br>
<button type="submit">Rate</button>
<br>
</form>
<br>
{%endblock content%}
